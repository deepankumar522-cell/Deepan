<!DOCTYPE html>
<html>
<head>
<title>For Keerthiga ❤️</title>

<style>
body{
  margin:0;
  padding:0;
  background:linear-gradient(to bottom,#ff9a9e,#fad0c4);
  height:100vh;
  overflow:hidden;
  font-family:Arial;
  text-align:center;
}

h1{
  margin-top:80px;
  color:white;
  font-size:35px;
}

button{
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:25px;
  margin:20px;
  cursor:pointer;
}

#yes{
  background:#ff4d6d;
  color:white;
}

#no{
  background:white;
  color:#ff4d6d;
  position:absolute;
}

.petal{
  position:fixed;
  top:-10px;
  font-size:20px;
  animation:fall linear infinite;
}

@keyframes fall{
  to{
    transform:translateY(110vh);
  }
}
</style>
</head>

<body>

<h1 id="text">Hi Keerthiga 🌹</h1>

<button id="yes" onclick="yesClick()">Yes</button>
<button id="no">No</button>

<script>

let steps=[
"From the first day I saw you ❤️",
"My heart started liking you 💫",
"You are very special to me 🌸",
"Keerthiga... Will you be mine forever? 💍"
];

let i=0;

document.getElementById("yes").onclick=function(){
if(i<steps.length){
document.getElementById("text").innerHTML=steps[i];
i++;
}else{
document.getElementById("text").innerHTML="Yay! I love you Keerthiga ❤️🌹";
}
}

let noBtn=document.getElementById("no");

noBtn.addEventListener("mouseover",function(){
let x=Math.random()*window.innerWidth;
let y=Math.random()*window.innerHeight;
noBtn.style.left=x+"px";
noBtn.style.top=y+"px";
});

function yesClick(){}

function createPetal(){
let petal=document.createElement("div");
petal.classList.add("petal");
petal.innerHTML="🌹";
petal.style.left=Math.random()*100+"vw";
petal.style.animationDuration=(3+Math.random()*5)+"s";
document.body.appendChild(petal);

setTimeout(()=>{petal.remove();},8000);
}

setInterval(createPetal,300);

</script>

</body>
</html>
